[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memform"
version = "1.0.0"
description = "Deterministic benchmark of persistent-memory poisoning in LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "llama-index>=0.14.0",
    "llama-index-llms-openai>=0.7.0",
    "tiktoken>=0.7.0",
]

[project.scripts]
memform = "memform.__main__:main"

[tool.setuptools.packages.find]
include = ["memform*"]
